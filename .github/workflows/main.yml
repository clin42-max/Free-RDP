name: Free RDP via Pinggy (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          Write-Host "🔧 Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user CloudUser UltraFast!2025 /add
          net localgroup administrators CloudUser /add
          Write-Host "✅ User created: CloudUser / UltraFast!2025"

      - name: Download Pinggy Client
        shell: pwsh
        run: |
          Write-Host "🌍 Downloading Pinggy..."
          Invoke-WebRequest -Uri "https://github.com/jpramesh/pinggy/releases/latest/download/pinggy_windows_amd64.zip" -OutFile "$env:TEMP\pinggy.zip"
          Expand-Archive "$env:TEMP\pinggy.zip" -DestinationPath "$env:TEMP\pinggy" -Force
          Copy-Item "$env:TEMP\pinggy\pinggy.exe" "C:\pinggy.exe" -Force
          Write-Host "✅ Pinggy installed."

      - name: Start RDP Tunnel via Pinggy
        shell: pwsh
        run: |
          Write-Host "🚀 Starting Pinggy tunnel..."
          Start-Process -FilePath "C:\pinggy.exe" -ArgumentList "tcp --to 3389" -NoNewWindow
          Start-Sleep -Seconds 10

          Write-Host "📡 Tunnel started!"
          Write-Host "🧑 Username: CloudUser"
          Write-Host "🔑 Password: UltraFast!2025"
          Write-Host ""
          Write-Host "Use the Pinggy link above to connect via Remote Desktop."
