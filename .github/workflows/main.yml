name: Fast RDP Windows (Secure v3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP & Optimize
      run: |
        echo "🔧 Enabling RDP..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        echo "👤 Creating user..."
        net user CloudUser UltraFast!2025 /add
        net localgroup administrators CloudUser /add

        echo "⚙️ High Performance Mode..."
        powercfg -setactive SCHEME_MIN

        echo "🚀 Network Optimization..."
        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global chimney=enabled
        netsh int tcp set global rss=enabled
        netsh int tcp set global ecncapability=disabled

    - name: Install ngrok
      run: |
        echo "📦 Installing ngrok..."
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        Move-Item .\ngrok\ngrok.exe C:\Windows\System32\ngrok.exe

    - name: Start RDP Tunnel
      run: |
        echo "🔐 Authenticating ngrok..."
        ngrok authtoken $Env:NGROK_AUTH_TOKEN
        echo "🚀 Launching tunnel..."
        Start-Process ngrok tcp 3389 --region eu

        echo "⏳ Waiting 20 seconds for ngrok to start..."
        Start-Sleep -Seconds 20
        Invoke-WebRequest "http://127.0.0.1:4040/api/tunnels" -OutFile tunnel.json
        Write-Host "✅ Tunnel Info:"
        Get-Content tunnel.json
        echo ""
        echo "🖥️  Login Credentials:"
        echo "Username: CloudUser"
        echo "Password: UltraFast!2025"
        echo "👉 Visit https://dashboard.ngrok.com/status/tunnels for your RDP address."
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
