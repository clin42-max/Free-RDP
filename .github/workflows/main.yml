name: Manual ngrok RDP (v4)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP and Create User
      run: |
        echo "🔧 Enabling RDP..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        echo "👤 Creating user..."
        net user CloudUser UltraFast!2025 /add
        net localgroup administrators CloudUser /add

    - name: Download and Install ngrok
      shell: powershell
      run: |
        echo "📦 Downloading ngrok..."
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
        Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP\ngrok"
        Copy-Item "$env:TEMP\ngrok\ngrok.exe" "C:\Windows\System32\ngrok.exe" -Force
        ngrok version

    - name: Start ngrok Tunnel
      shell: powershell
      run: |
        echo "🔐 Adding ngrok auth token manually..."
        ngrok authtoken 343gfZHPZFCZOLZqUNejgEb5dEC_55fTGtP4VsmPkcdQJXL9R

        echo "🚀 Starting tunnel..."
        Start-Process -NoNewWindow ngrok "tcp 3389 --region eu"
        Start-Sleep -Seconds 25

        echo "🌍 Fetching tunnel address..."
        $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $rdpAddress = $response.tunnels[0].public_url
        echo "============================================="
        echo "✅ RDP is Ready!"
        echo "Address: $rdpAddress"
        echo "Username: CloudUser"
        echo "Password: UltraFast!2025"
        echo "============================================="
