name: Fast & Reliable RDP (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP & Create User
      run: |
        Write-Host "🔧 Enabling RDP..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        Write-Host "👤 Creating User..."
        net user AdminRDP UltraFast!2025 /add
        net localgroup administrators AdminRDP /add

        Write-Host "⚙️ Setting High Performance Mode..."
        powercfg -setactive SCHEME_MIN

        Write-Host "🚀 Network Optimization..."
        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global chimney=enabled
        netsh int tcp set global rss=enabled
        netsh int tcp set global ecncapability=disabled

    - name: Download & Install ngrok (Always Works)
      shell: pwsh
      run: |
        Write-Host "📦 Downloading ngrok (official source)..."
        try {
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile "ngrok.zip" -ErrorAction Stop
        } catch {
          Write-Host "⚠️ Invoke-WebRequest failed, trying curl.exe..."
          curl.exe -L -o ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip"
        }

        if (-Not (Test-Path ngrok.zip)) {
          Write-Error "❌ ngrok.zip not found after download attempts."
          exit 1
        }

        Expand-Archive ngrok.zip -DestinationPath .
        Move-Item .\ngrok\ngrok.exe C:\Windows\System32\ngrok.exe -Force
        Write-Host "✅ ngrok successfully installed."

    - name: Start RDP Tunnel
      shell: pwsh
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        Write-Host "🔐 Authenticating ngrok..."
        ngrok authtoken $Env:NGROK_AUTH_TOKEN

        Write-Host "🚀 Launching ngrok TCP tunnel..."
        Start-Process ngrok "tcp 3389 --region eu" -WindowStyle Hidden

        Write-Host "⏳ Waiting 25 seconds for ngrok tunnel to be ready..."
        Start-Sleep -Seconds 25

        try {
          $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $url = $response.tunnels.public_url
          Write-Host "✅ RDP is Live!"
          Write-Host "🌐 Address: $url"
        } catch {
          Write-Host "⚠️ Could not fetch tunnel info. You can check manually at https://dashboard.ngrok.com/status/tunnels"
        }

        Write-Host "`n🖥️ Login Info:"
        Write-Host "Username: AdminRDP"
        Write-Host "Password: UltraFast!2025"
