name: Fast & Stable RDP (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP & Create User
      run: |
        Write-Host "🔧 Enabling Remote Desktop..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        Write-Host "👤 Creating Administrator User..."
        net user AdminRDP UltraFast!2025 /add
        net localgroup administrators AdminRDP /add

        Write-Host "⚙️ Enabling High Performance Power Plan..."
        powercfg -setactive SCHEME_MIN

        Write-Host "🚀 Network optimization..."
        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global chimney=enabled
        netsh int tcp set global rss=enabled
        netsh int tcp set global ecncapability=disabled

    - name: Install ngrok (Stable Download)
      run: |
        Write-Host "📦 Downloading ngrok (with retry)..."
        $url = "https://raw.githubusercontent.com/derekhe/msedge-win7/master/ngrok-stable-windows-amd64.zip"
        $attempts = 0
        while ($attempts -lt 3) {
          try {
            Invoke-WebRequest $url -OutFile ngrok.zip -ErrorAction Stop
            break
          } catch {
            $attempts++
            Write-Host "Retrying download ($attempts)..."
            Start-Sleep -Seconds 5
          }
        }

        if (-Not (Test-Path ngrok.zip)) {
          Write-Error "❌ Failed to download ngrok after multiple attempts."
          exit 1
        }

        Expand-Archive ngrok.zip -DestinationPath .
        Move-Item .\ngrok\ngrok.exe C:\Windows\System32\ngrok.exe -Force
        Write-Host "✅ ngrok installed successfully."

    - name: Start RDP Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        Write-Host "🔐 Authenticating ngrok..."
        ngrok authtoken $Env:343gfZHPZFCZOLZqUNejgEb5dEC_55fTGtP4VsmPkcdQJXL9R

        Write-Host "🚀 Starting ngrok TCP tunnel on port 3389..."
        Start-Process ngrok "tcp 3389 --log=stdout > ngrok.log" -WindowStyle Hidden

        Write-Host "⏳ Waiting 25 seconds for tunnel to start..."
        Start-Sleep -Seconds 25

        $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $public_url = $response.tunnels.public_url
        Write-Host "✅ RDP is now live!"
        Write-Host "🌐 RDP Address: $public_url"
        Write-Host "👤 Username: AdminRDP"
        Write-Host "🔑 Password: UltraFast!2025"
        Write-Host "💡 Copy the host/port (after tcp://) and use it in Remote Desktop."
