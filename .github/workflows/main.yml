name: Free RDP via LocalXpose (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600000

    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "🔧 Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user CloudUser UltraFast!2025 /add
          net localgroup administrators CloudUser /add
          Write-Host "✅ User CloudUser created. Password: UltraFast!2025"

      - name: Download LocalXpose
        shell: pwsh
        run: |
          Write-Host "🌍 Downloading LocalXpose..."
          $zip = "$env:TEMP\loclx.zip"

          $urls = @(
            "https://localxpose.io/downloads/loclx-windows-amd64.zip",
            "https://download.localxpose.io/loclx/loclx-windows-amd64.zip"
          )

          $success = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop
              Write-Host "✅ Downloaded from: $url"
              $success = $true
              break
            } catch {
              Write-Host "❌ Failed to download from: $url"
            }
          }

          if (-not $success) {
            Write-Host "⚠️ All LocalXpose links failed!"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\loclx" -Force
          Copy-Item "$env:TEMP\loclx\loclx.exe" "C:\loclx.exe" -Force
          Write-Host "✅ LocalXpose installed."

      - name: Start RDP tunnel
        shell: pwsh
        run: |
          Write-Host "🚀 Authenticating LocalXpose..."
          & C:\loclx.exe authtoken 13877No15rwYxPON9SWoVE09Hxj4pXG85AZDOTsX

          Write-Host "🌐 Starting tunnel..."
          Start-Process -FilePath "C:\loclx.exe" -ArgumentList "tcp --to 3389" -NoNewWindow
          Start-Sleep -Seconds 10

          Write-Host "📡 Fetching tunnel info..."
          & C:\loclx.exe tunnels

          Write-Host "`nLogin with:"
          Write-Host "🧑 User: CloudUser"
          Write-Host "🔑 Password: UltraFast!2025"
