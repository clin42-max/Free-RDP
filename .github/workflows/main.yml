name: FINAL Stable RDP (ngrok Manual Key)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP and Create User
      shell: powershell
      run: |
        Write-Host "🔧 Enabling RDP..."
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1

        Write-Host "👤 Creating user..."
        net user CloudUser UltraFast!2025 /add
        net localgroup administrators CloudUser /add

    - name: Install ngrok
      shell: powershell
      run: |
        Write-Host "📦 Downloading ngrok..."
        $ngrokZip = "$env:TEMP\ngrok.zip"
        $url = "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip"
        Invoke-WebRequest $url -OutFile $ngrokZip
        Expand-Archive -Path $ngrokZip -DestinationPath "$env:TEMP\ngrok" -Force
        Copy-Item "$env:TEMP\ngrok\ngrok.exe" "C:\ngrok.exe" -Force
        Write-Host "✅ ngrok installed successfully."

    - name: Start ngrok Tunnel
      shell: powershell
      run: |
        Write-Host "🔐 Setting ngrok auth token..."
        & C:\ngrok.exe authtoken 343gfZHPZFCZOLZqUNejgEb5dEC_55fTGtP4VsmPkcdQJXL9R

        Write-Host "🚀 Starting tunnel..."
        Start-Process -FilePath "C:\ngrok.exe" -ArgumentList "tcp 3389 --region us" -WindowStyle Hidden
        Start-Sleep -Seconds 30

        Write-Host "🌍 Fetching tunnel URL..."
        $result = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
        $address = $result.tunnels[0].public_url
        Write-Host "========================================="
        Write-Host "✅ RDP is Ready!"
        Write-Host "Address: $address"
        Write-Host "Username: CloudUser"
        Write-Host "Password: UltraFast!2025"
        Write-Host "========================================="
