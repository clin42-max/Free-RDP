name: Free RDP via LocalXpose

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Enable RDP and create user
      shell: pwsh
      run: |
        Write-Host "Enabling Remote Desktop..."
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "Creating user CloudUser..."
        net user CloudUser UltraFast!2025 /add
        net localgroup administrators CloudUser /add

    - name: Download LocalXpose (loclx) client
      shell: pwsh
      run: |
        Write-Host "Downloading LocalXpose..."
        $zip = "$env:TEMP\loclx.zip"
        $url = "https://api.localxpose.io/downloads/loclx-windows-amd64.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath "$env:TEMP\loclx" -Force
        Copy-Item "$env:TEMP\loclx\loclx.exe" "C:\loclx.exe" -Force
        & C:\loclx.exe version

    - name: Authenticate and start TCP tunnel (uses your token)
      shell: pwsh
      run: |
        Write-Host "Adding auth token..."
        & C:\loclx.exe authtoken 13877No15rwYxPON9SWoVE09Hxj4pXG85AZDOTsX

        Write-Host "Starting LocalXpose TCP tunnel to local RDP (3389)..."
        # start loclx in background, forwarding a public tcp port to local 3389
        Start-Process -FilePath "C:\loclx.exe" -ArgumentList "tcp --to 3389" -NoNewWindow

        Start-Sleep -Seconds 12

        Write-Host "Fetching tunnel info (this prints the forwarded address):"
        & C:\loclx.exe tunnels
        Write-Host "If the 'tunnels' command printed a tcp address like tcp://x.tcp.localxpose.io:PORT, use that in your RDP client."

        Write-Host "`nLogin credentials for the VM:"
        Write-Host "Username: CloudUser"
        Write-Host "Password: UltraFast!2025"
