name: Free RDP via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          Write-Host "🔧 Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user CloudUser UltraFast!2025 /add
          net localgroup administrators CloudUser /add
          Write-Host "✅ User created: CloudUser / UltraFast!2025"

      - name: Download and Install Cloudflared
        shell: pwsh
        run: |
          Write-Host "🌍 Downloading Cloudflared..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"
          Write-Host "✅ Cloudflared installed successfully."

      - name: Start RDP Tunnel via Cloudflare
        shell: pwsh
        run: |
          Write-Host "🚀 Starting Cloudflare Tunnel..."
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "📡 Tunnel started successfully!"
          Write-Host ""
          Write-Host "🧑 User: CloudUser"
          Write-Host "🔑 Password: UltraFast!2025"
          Write-Host ""
          Write-Host "The public access URL will appear above — copy it and open it in your browser."
