name: RDP with Ngrok

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'RDP session duration (minutes)'
        required: true
        default: '600'
        type: choice
        options:
        - 300
        - 600
        - 120000
        - 240000

jobs:
  rdp-session:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and setup ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath .
        .\ngrok.exe version
        
    - name: Configure ngrok authtoken
      run: .\ngrok.exe config add-authtoken "343gfZHPZFCZOLZqUNejgEb5dEC_55fTGtP4VsmPkcdQJXL9R"
      # ⚠️ REPLACE "YOUR_NGROK_AUTH_TOKEN_HERE" WITH YOUR ACTUAL TOKEN

    - name: Enable RDP and set password
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 16 | % {[char]$_})
        $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $securePassword -ErrorAction SilentlyContinue
        if (-not $?) {
          New-LocalUser -Name "runneradmin" -Password $securePassword -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        }
        echo "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Start ngrok tunnel for RDP
      run: |
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
        Start-Sleep -Seconds 10
        
        $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $public_url = $tunnels.tunnels[0].public_url
        echo "PUBLIC_RDP_URL=$public_url" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        Write-Host "RDP Connection Details:"
        Write-Host "URL: $public_url"
        Write-Host "Username: runneradmin"
        Write-Host "Password: $env:RDP_PASSWORD"

    - name: Keep RDP session alive
      run: |
        $duration = ${{ github.event.inputs.duration }}
        Write-Host "RDP session will be available for $duration minutes"
        
        for ($i = 0; $i -lt $duration; $i++) {
          Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] RDP Session active - $($duration - $i) minutes remaining"
          Write-Host "Connect using: $env:PUBLIC_RDP_URL"
          Write-Host "Username: clin42.max"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "----------------------------------------"
          Start-Sleep -Seconds 60
        }

    - name: Cleanup
      if: always()
      run: |
        Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1
